<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#09090d"/>
    </linearGradient>
    <linearGradient id="glowGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brandGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="640" cy="400" r="420" fill="url(#glowGrad2)"/>

  <!-- Left Sidebar Mock -->
  <rect x="0" y="0" width="220" height="800" fill="#0f0f15" stroke="#27272a" stroke-width="1"/>
  <!-- Logo -->
  <rect x="24" y="28" width="36" height="36" rx="10" fill="url(#brandGrad2)"/>
  <rect x="70" y="38" width="90" height="16" rx="8" fill="#e4e4e7" fill-opacity="0.9"/>
  <!-- Nav items -->
  <rect x="20" y="96" width="180" height="38" rx="10" fill="#27272a" fill-opacity="0.5"/>
  <circle cx="38" cy="115" r="7" fill="#3b82f6"/>
  <rect x="56" y="108" width="95" height="14" rx="7" fill="#ffffff"/>
  
  <rect x="20" y="146" width="180" height="38" rx="10" fill="transparent"/>
  <circle cx="38" cy="165" r="7" fill="#52525b"/>
  <rect x="56" y="158" width="80" height="14" rx="7" fill="#71717a"/>

  <rect x="20" y="196" width="180" height="38" rx="10" fill="transparent"/>
  <circle cx="38" cy="215" r="7" fill="#52525b"/>
  <rect x="56" y="208" width="110" height="14" rx="7" fill="#71717a"/>

  <rect x="20" y="246" width="180" height="38" rx="10" fill="transparent"/>
  <circle cx="38" cy="265" r="7" fill="#52525b"/>
  <rect x="56" y="258" width="70" height="14" rx="7" fill="#71717a"/>

  <!-- Topbar Mock -->
  <rect x="220" y="0" width="1060" height="70" fill="#0f0f15" stroke="#27272a" stroke-width="1"/>
  <rect x="250" y="18" width="280" height="34" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <circle cx="270" cy="35" r="6" fill="#71717a"/>
  <rect x="286" y="29" width="120" height="12" rx="6" fill="#52525b"/>
  <circle cx="1210" cy="35" r="18" fill="#27272a"/>
  <circle cx="1160" cy="35" r="14" fill="#18181b" stroke="#27272a" stroke-width="1"/>

  <!-- Content Grid -->
  <!-- 3 Mini Stats Cards -->
  <g transform="translate(250, 96)">
    <rect x="0" y="0" width="310" height="100" rx="14" fill="#14141c" stroke="#27272a" stroke-width="1"/>
    <rect x="20" y="20" width="80" height="12" rx="6" fill="#71717a"/>
    <rect x="20" y="44" width="130" height="24" rx="6" fill="#ffffff"/>
    <rect x="200" y="32" width="90" height="36" rx="8" fill="#1e293b"/>

    <rect x="340" y="0" width="310" height="100" rx="14" fill="#14141c" stroke="#27272a" stroke-width="1"/>
    <rect x="360" y="20" width="80" height="12" rx="6" fill="#71717a"/>
    <rect x="360" y="44" width="140" height="24" rx="6" fill="#ffffff"/>
    <rect x="540" y="32" width="90" height="36" rx="8" fill="#1e293b"/>

    <rect x="680" y="0" width="310" height="100" rx="14" fill="#14141c" stroke="#27272a" stroke-width="1"/>
    <rect x="700" y="20" width="80" height="12" rx="6" fill="#71717a"/>
    <rect x="700" y="44" width="120" height="24" rx="6" fill="#ffffff"/>
    <rect x="880" y="32" width="90" height="36" rx="8" fill="#1e293b"/>
  </g>

  <!-- Central Upload Placeholder Area -->
  <g transform="translate(745, 460)">
    <rect x="-380" y="-190" width="760" height="380" rx="20" fill="#13131c" fill-opacity="0.9" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 6"/>
    
    <!-- Center Icon -->
    <rect x="-44" y="-120" width="88" height="88" rx="24" fill="url(#brandGrad2)"/>
    <path d="M-16 -76 L0 -92 L16 -76 M0 -92 L0 -60" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -52 L22 -52" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">Web App 02</text>
    <text x="0" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle">Ready for Application Screenshots</text>

    <!-- Upload Status Badge -->
    <rect x="-130" y="70" width="260" height="42" rx="21" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="-100" cy="91" r="5" fill="#3b82f6"/>
    <text x="10" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#60a5fa" text-anchor="middle">Awaiting User Upload</text>
  </g>

  <!-- Subtle bottom chart bars -->
  <g transform="translate(250, 710)">
    <rect x="0" y="0" width="160" height="12" rx="6" fill="#27272a"/>
    <rect x="200" y="0" width="220" height="12" rx="6" fill="#27272a"/>
    <rect x="460" y="0" width="180" height="12" rx="6" fill="#27272a"/>
    <rect x="680" y="0" width="260" height="12" rx="6" fill="#27272a"/>
  </g>
</svg>

