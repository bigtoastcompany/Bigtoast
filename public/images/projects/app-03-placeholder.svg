<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1024" width="480" height="1024">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="iconGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="1024" fill="url(#bg3)"/>
  <rect width="480" height="1024" fill="url(#glow3)"/>
  
  <!-- Subtle UI header mock -->
  <rect x="36" y="80" width="140" height="24" rx="12" fill="#1e293b" fill-opacity="0.6"/>
  <circle cx="430" cy="92" r="16" fill="#1e293b" fill-opacity="0.6"/>
  
  <!-- Central Icon & Badge -->
  <g transform="translate(240, 360)">
    <rect x="-56" y="-56" width="112" height="112" rx="28" fill="url(#iconGrad3)" filter="drop-shadow(0 12px 28px rgba(56,189,248,0.35))"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M-8 0 L8 0 M0 -8 L0 8" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <text x="240" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">App 03</text>
  <text x="240" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">Ready for Screenshots</text>
  
  <rect x="140" y="535" width="200" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
  <text x="240" y="557" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Awaiting User Upload</text>

  <!-- Bottom Nav Mock -->
  <rect x="24" y="930" width="432" height="64" rx="32" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
  <circle cx="100" cy="962" r="8" fill="#475569"/>
  <circle cx="193" cy="962" r="8" fill="#38bdf8"/>
  <circle cx="286" cy="962" r="8" fill="#475569"/>
  <circle cx="380" cy="962" r="8" fill="#475569"/>
