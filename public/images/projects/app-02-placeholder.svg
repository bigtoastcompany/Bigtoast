<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1024" width="480" height="1024">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="50%" stop-color="#14141d"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="1024" fill="url(#bg2)"/>
  <rect width="480" height="1024" fill="url(#glow2)"/>
  
  <!-- Subtle UI header mock -->
  <rect x="36" y="80" width="140" height="24" rx="12" fill="#27272a" fill-opacity="0.6"/>
  <circle cx="430" cy="92" r="16" fill="#27272a" fill-opacity="0.6"/>
  
  <!-- Central Icon & Badge -->
  <g transform="translate(240, 360)">
    <rect x="-56" y="-56" width="112" height="112" rx="28" fill="url(#iconGrad2)" filter="drop-shadow(0 12px 28px rgba(245,158,11,0.35))"/>
    <path d="M-18 -18 L18 18 M18 -18 L-18 18" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff" fill-opacity="0.9"/>
  </g>
  
  <text x="240" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">App 02</text>
  <text x="240" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#a1a1aa" text-anchor="middle">Ready for Screenshots</text>
  
  <rect x="140" y="535" width="200" height="34" rx="17" fill="#27272a" fill-opacity="0.8" stroke="#3f3f46" stroke-width="1"/>
  <text x="240" y="557" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">Awaiting User Upload</text>

  <!-- Bottom Nav Mock -->
  <rect x="24" y="930" width="432" height="64" rx="32" fill="#18181b" fill-opacity="0.8" stroke="#27272a" stroke-width="1"/>
  <circle cx="100" cy="962" r="8" fill="#52525b"/>
  <circle cx="193" cy="962" r="8" fill="#52525b"/>
  <circle cx="286" cy="962" r="8" fill="#f59e0b"/>
  <circle cx="380" cy="962" r="8" fill="#52525b"/>
